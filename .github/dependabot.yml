version: 2

# Grouping strategy:
#   - minor/patch updates are bundled into a single PR per ecosystem (low risk, review together)
#   - major updates are intentionally left UNGROUPED so each lands in its own PR
#     (a major bump can break the build; keeping it isolated makes the cause traceable)
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ignition-sdk:
        patterns: ["com.inductiveautomation*"]
      gradle-plugins:
        patterns: ["io.ia.sdk*", "com.github.node-gradle*"]
      gradle-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      echarts:
        patterns: ["echarts*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: "development"
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
