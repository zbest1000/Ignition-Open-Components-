name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  # Needs the repository's dependency graph (Settings > Advanced Security); without it the
  # API answers 403. Enable the graph, then set the repository variable
  # DEPENDENCY_REVIEW to "true" to turn this job on. The build job's npm audit gate runs regardless.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails the PR if it introduces a dependency with a known moderate-or-worse advisory.
      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
