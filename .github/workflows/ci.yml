name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "version=0.0.0-pr${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "version=0.1.0-dev+${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build module
        run: ./gradlew clean build -PmoduleVersion=${{ steps.version.outputs.version }}

      - name: Verify .modl artifact
        run: |
          MODL=$(find build -name '*.modl' | head -1)
          if [ -z "$MODL" ]; then echo "ERROR: No .modl found"; exit 1; fi
          echo "Artifact: $MODL"
          echo "Size: $(du -h "$MODL" | cut -f1)"
          unzip -l "$MODL"

      - name: Upload unsigned module
        uses: actions/upload-artifact@v4
        with:
          name: Open-ECharts-${{ steps.version.outputs.version }}.unsigned.modl
          path: build/*.modl
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        run: |
          MODL=$(find build -name '*.modl' | head -1)
          SIZE=$(du -h "$MODL" | cut -f1)
          echo "## Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Version** | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Artifact** | \`$(basename $MODL)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Size** | ${SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Java** | ${{ env.JAVA_VERSION }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Ignition SDK** | 8.3.0 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ECharts** | 5.6.0 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **ECharts-GL** | 2.0.9 |" >> "$GITHUB_STEP_SUMMARY"
