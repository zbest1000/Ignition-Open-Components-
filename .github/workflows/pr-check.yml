name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: web/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Build module
        id: build
        run: |
          ./gradlew clean build -PmoduleVersion=0.0.0-pr${{ github.event.pull_request.number }}
          MODL=$(find build -name '*.modl' | head -1)
          SIZE=$(du -h "$MODL" | cut -f1)
          echo "size=${SIZE}" >> "$GITHUB_OUTPUT"

      - name: Check module.xml
        run: |
          MODL=$(find build -name '*.modl' | head -1)
          unzip -p "$MODL" module.xml | head -30

      - name: PR comment with build info
        uses: actions/github-script@v9
        with:
          script: |
            const body = `### Build Successful
            | Property | Value |
            |----------|-------|
            | Module size | \`${{ steps.build.outputs.size }}\` |
            | Java | ${{ env.JAVA_VERSION }} |
            | Ignition SDK | 8.3.0 |

            The \`.modl\` artifact is available in the workflow run artifacts.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('### Build Successful')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
