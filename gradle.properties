# Committed, secret-free build settings.
#
# Never put signing credentials here. They belong in ~/.gradle/gradle.properties
# (local builds) or in CI secrets -- see .github/CONTRIBUTING.md, "Module signing".

# Module version. Must be a form Ignition's version parser accepts:
#   X.Y.Z | X.Y.Z.BUILD | X.Y.Z-rcN | X.Y.Z-betaN | X.Y.Z-SNAPSHOT
# Override per build with -PmoduleVersion=...; the release workflow takes it from the tag.
version=0.1.0-SNAPSHOT

org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true
# Do not enable the configuration cache: the io.ia.sdk.modl plugin is not compatible with it.
